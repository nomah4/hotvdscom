#!/usr/sbin/nft -f
# Managed by ansible (gateway_nat role) — do not edit by hand.

flush ruleset

table ip nat {
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname "eth0" tcp dport 2201 dnat to 10.0.1.11:22
    iifname "eth0" tcp dport 2202 dnat to 10.0.1.12:22
    iifname "eth0" tcp dport 2203 dnat to 10.0.1.13:22
    iifname "eth0" tcp dport 2204 dnat to 10.0.1.14:22
  }

  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ip saddr 10.0.1.0/24 oifname "eth0" masquerade
  }
}

table ip filter {
  chain input {
    type filter hook input priority filter; policy accept;
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    ip saddr 10.0.1.0/24 oifname "eth0" accept
    ct status dnat accept
  }
}
