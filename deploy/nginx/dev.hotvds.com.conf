server {
    server_name dev.hotvds.com;

    root /var/www/dev.hotvds.com/dist;
    index index.html;

    # Staging environment — keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    include snippets/hotvds-spa-routes.conf;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    
    listen 127.0.0.1:8443 ssl; # managed by Certbot (behind stream SNI router)
    ssl_certificate /etc/letsencrypt/live/dev.hotvds.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.hotvds.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = dev.hotvds.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dev.hotvds.com;
    return 404; # managed by Certbot


}