server {
    listen 127.0.0.1:8443 ssl;
    server_name hotvds.com;

    root /var/www/hotvds.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotvds.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    include snippets/hotvds-spa-routes.conf;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hotvds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
