# chat.hotvds.com — TLS-terminated here, proxied to 10.0.1.14:3000 over
# the private segment. Sits behind the stream{} SNI router (see stream.conf),
# so this only ever receives traffic already matched to chat.hotvds.com.
server {
    listen 127.0.0.1:8447 ssl;
    server_name chat.hotvds.com;

    ssl_certificate /etc/letsencrypt/live/chat.hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.hotvds.com/privkey.pem;

    client_max_body_size 40m;

    location /cable {
        proxy_pass http://10.0.1.14:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://10.0.1.14:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.hotvds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
