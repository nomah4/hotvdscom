# Routing for the hotvds single-page app.
#
# The problem this solves: `try_files $uri $uri/ /index.html` answers 200 for
# every path, so a mistyped or retired URL looked to a crawler like a real page
# that happens to render "not found". Soft 404s get indexed.
#
# So: paths the app actually has are served normally; everything else still gets
# the app — the visitor keeps a usable, localized page with the site map in its
# footer — but with a genuine 404 status.
#
# The route list mirrors `routePaths` in src/i18n/paths.ts. Adding a route there
# without adding it here makes that page answer 404 while still rendering, which
# is why the list is kept in one line, sorted, easy to diff.

location ~ ^/(callback/?|(ru|en)(/(about|admin|api|blog|checkout|checkout/return|contacts|dashboard|dashboard/new|datacenters|knowledge-base|partners|pricing|status|terms))?/?)?$ {
    # The shell must never be cached: its whole job is to name the current
    # hashed bundle, and a browser holding yesterday copy keeps loading
    # yesterday app. The bundles under /assets/ stay immutable - they are
    # content-addressed, so they can be cached hard.
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
    # The explicit =404 is load-bearing: a bare `error_page 404 /index.html`
    # serves the shell but relabels the response 200, which is the very bug
    # this fixes. Scoped to this block so a missing /assets/* file keeps its own
    # small 404 instead of shipping the whole document.
    error_page 404 =404 /index.html;
}
