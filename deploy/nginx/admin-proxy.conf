# bl.hotvds.com — TLS-terminated here, proxied to 10.0.1.11:8000 over
# the private segment. Sits behind the stream{} SNI router (see stream.conf),
# so this only ever receives traffic already matched to bl.hotvds.com.
server {
    listen 127.0.0.1:8444 ssl;
    server_name bl.hotvds.com;

    ssl_certificate /etc/letsencrypt/live/bl.hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bl.hotvds.com/privkey.pem;

    location / {
        proxy_pass http://10.0.1.11:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bl.hotvds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
