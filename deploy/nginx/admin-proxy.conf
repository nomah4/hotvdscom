# chat.hotvds.com — TLS-terminated here, proxied to 10.0.1.14:3000 over
# the private segment. Sits behind the stream{} SNI router (see stream.conf),
# so this only ever receives traffic already matched to chat.hotvds.com.
server {
    listen 127.0.0.1:8447 ssl;
    server_name chat.hotvds.com;

    ssl_certificate /etc/letsencrypt/live/chat.hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.hotvds.com/privkey.pem;

    client_max_body_size 40m;

    location /cable {
        proxy_pass http://10.0.1.14:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://10.0.1.14:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.hotvds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# pv.hotvds.com — админка движка провижена, проксируется на 10.0.1.15:8003.
# За SNI-роутером stream{}, поэтому сюда приходит только уже сматченный трафик.
server {
    listen 80;
    listen [::]:80;
    server_name pv.hotvds.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8449 ssl;
    server_name pv.hotvds.com;

    ssl_certificate /etc/letsencrypt/live/pv.hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pv.hotvds.com/privkey.pem;

    location / {
        proxy_pass http://10.0.1.15:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
# console.hotvds.com — консоль к машинам клиентов (ADR-0012 движка).
#
# Пока только :80: он нужен certbot для HTTP-01, и он должен существовать до
# выпуска сертификата. TLS-часть добавляется следом, после certbot.
server {
    listen 80;
    listen [::]:80;
    server_name console.hotvds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# console.hotvds.com — консоль к машинам клиентов (ADR-0012 движка).
#
# Отдельное имя, а не путь на pv или в кабинете: страница консоли это полный
# терминал к чужой машине, и на своём origin она не делит куки ни с кабинетом,
# ни с биллингом. Её компрометация не даёт биллинговой сессии.
#
# Один и тот же путь /c/<тикет> отдаёт и страницу, и вебсокет: браузер сначала
# получает HTML обычным GET, потом та же страница поднимает wss по тому же
# адресу. Поэтому Upgrade пробрасывается на всё, а не на отдельный location —
# при пустом $http_upgrade карта ниже ставит Connection close, и обычный GET
# ведёт себя как обычный GET.
map $http_upgrade $console_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 127.0.0.1:8450 ssl;
    server_name console.hotvds.com;

    ssl_certificate /etc/letsencrypt/live/console.hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.hotvds.com/privkey.pem;

    location / {
        proxy_pass http://10.0.1.15:8004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $console_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Сессия консоли молчит, пока никто не печатает. Обычные 60 секунд
        # рвали бы её на каждой паузе; предел на саму сессию держит прокси.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Экран машины идёт потоком, буферизация тут только добавляет задержку.
        proxy_buffering off;
    }
}
