# Where a connection with no recognised server name ends up.
#
# The stream{} router matches on SNI and needs somewhere to send what it does
# not recognise — a scanner walking the IP range, a stale DNS record, a client
# that sent no SNI at all. That default used to be Billing, so anything
# unidentified reached the money service. It comes here instead.
#
# 502 has to be answered by an http server, because stream{} works below HTTP
# and has no status codes to return. So TLS is terminated here and the request
# is refused.
#
# The certificate is hotvds.com's. Nothing else would be right: the client
# asked for a name we do not serve, so any certificate mismatches. It gets a
# name mismatch and a 502 rather than a route into Billing.
server {
    listen 127.0.0.1:8448 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/hotvds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotvds.com/privkey.pem;

    access_log /var/log/nginx/default-sni.log;

    return 502;
}
